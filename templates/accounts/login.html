{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-16" x-data="{ show: false }">
  <h1 class="font-serif text-3xl font-semibold text-center mb-2">Connexion</h1>
  <p class="text-sm text-zinc-500 text-center mb-8">Accédez à votre espace personnel.</p>

  <form method="post" class="space-y-4">
    {% csrf_token %}

    <div>
      <label for="id_email" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Email</label>
      <input type="email" name="email" id="id_email" value="{{ form.email.value|default:'' }}" required autofocus
        class="w-full bg-zinc-900 border border-zinc-800 px-3 py-2.5 text-sm text-zinc-200 focus:border-brand-600 focus:outline-none">
    </div>

    <div>
      <label for="id_password" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Mot de passe</label>
      <div class="relative">
        <input :type="show ? 'text' : 'password'" name="password" id="id_password" required
          class="w-full bg-zinc-900 border border-zinc-800 px-3 py-2.5 pr-10 text-sm text-zinc-200 focus:border-brand-600 focus:outline-none">
        <button type="button" @click="show = !show" class="absolute inset-y-0 right-0 flex items-center pr-3 text-zinc-500 hover:text-zinc-300 transition-colors" tabindex="-1">
          <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.64 0 8.577 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.64 0-8.577-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <svg x-show="show" x-cloak xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="w-full bg-brand-600 py-3 text-sm font-medium text-zinc-950 hover:bg-brand-500 transition-colors">
      Se connecter
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-zinc-500">
    Pas encore de compte ?
    <a href="{% url 'accounts:register' %}" class="text-brand-400 hover:text-brand-300">Créer un compte</a>
  </p>
</div>
{% endblock %}
